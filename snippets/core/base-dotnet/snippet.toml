id = "core/base-dotnet"
version = "0.1.0"
title = ".NET runtime base"
category = "base"
summary = "Microsoft's .NET runtime on Ubuntu: for Vintage Story and other .NET servers."
source = "~/vintagestory.flk/Dockerfile"

[params.version]
type = "string"
default = "10.0"
prompt = ".NET version (the image tag)"
validate = '^[0-9]+\.[0-9]+$'

[base]
image = "mcr.microsoft.com/dotnet/runtime:{{.P.version}}"
family = "apt"
user = "ubuntu"

[hints]
what = "Starts the image from the .NET runtime (Ubuntu-based; dotnet on the PATH)."
under_the_hood = """
The runtime image runs framework-dependent apps (dotnet Server.dll). The
ubuntu user is uid 1000. The image comes from mcr.microsoft.com, written
in full like every image flkforge writes.
"""
gotchas = ["The runtime image has no SDK: build .NET code elsewhere, or in a stage of its own."]
docs = ["flk help dockerfile", "flk help --all  (Machines)"]
