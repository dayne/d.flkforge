id = "core/secret"
version = "0.1.0"
title = "Secret"
category = "env"
summary = "A secret the app reads from its environment: only the name is recorded, never the value."
multi = true
source = "~/mqtt.flk (MQTT_PASSWORD_*), ~/enshrouded.flk (EN_PW_*)"

[params.name]
type = "secret"
required = true
prompt = "The variable's name (API_TOKEN)"

[params.purpose]
type = "string"
prompt = "What it's for (shown in the next steps)"

[[next]]
order = 30
text = "flk secrets set {{.P.name}}=- --stage"
why = "{{if .P.purpose}}{{.P.purpose}}: {{end}}reads the value from stdin, so it's not in your shell history; --stage applies it at the deploy"

[hints]
what = "Records that the app needs a secret, and puts setting it in the next steps."
under_the_hood = """
flk keeps secrets per app outside flk.toml (flk secrets set NAME=VALUE) and
passes them to the machine with its environment, next to [env]. They're
never in flk.toml, the recipe or any file flkforge writes. Changing a
secret restarts running machines unless --stage is given.
"""
gotchas = ["flkforge check says whether it's set (flk secrets list shows names and digests only)."]
docs = ["flk help secrets", "flk help --all  (Machines: env inside)"]
