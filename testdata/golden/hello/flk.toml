# hello: made by flkforge from flkforge.toml. Change the recipe and run
# `flkforge render`, or edit this file and stop using flkforge for it.
app = "hello"

[build]
  dockerfile = "Dockerfile"

[env]
  GREETING = "hi from flk"

[[vm]]
  size = "shared-cpu-1x"

[[mounts]]
  source = "data"
  destination = "/data"

# The port flk waits for after boot and prints as the app's URL.
[http_service]
  internal_port = 8080
