# flkt-template: made by flkforge from flkforge.toml. Change the recipe and run
# `flkforge render`, or edit this file and stop using flkforge for it.
app = "flkt-template"

[build]
  dockerfile = "Dockerfile"

# A deploy waits for this; a machine that fails it goes back to its
# previous release.
[checks.http]
  type = "http"
  port = 8080
  path = "/"
  grace_period = "30s"

[[vm]]
  cpus = 1
  memory = "256mb"

[[mounts]]
  source = "data"
  destination = "/data"

# The port flk waits for after boot and prints as the app's URL.
[http_service]
  internal_port = 8080
